{% extends "base.html" %}
{% block title %}Вход — Дитли{% endblock %}
{% block body %}
<section class="card narrow">
  <h1>Вход</h1>
  <p class="muted">Внутренний сервис. Открытой регистрации нет.</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('login_submit') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="next" value="{{ next_url }}">
    <label>
      Логин
      <input name="login" autocomplete="username" required value="{{ login_value|default('') }}">
    </label>
    <label>
      Пароль
      <input name="password" type="password" autocomplete="current-password" required>
    </label>
    <button type="submit">Войти</button>
  </form>
</section>
{% endblock %}
